<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<link
rel="stylesheet"
href="/static/auth.css">

</head>

<body>

<div class="auth-page">

<div class="auth-card">

<div class="auth-logo">
🔑
</div>

<h1>Forgot Password?</h1>

<p class="auth-subtitle">
Enter your email address to reset your password
</p>


<form id="forgotForm">

<div class="auth-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>


<div
id="authMessage"
class="auth-message">
</div>


<button
type="submit"
class="auth-primary-btn">

Reset Password

</button>

</form>


<p class="auth-switch">

<a href="/login">
← Back to Login
</a>

</p>

</div>

</div>


<script>

document
.getElementById("forgotForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const response =
        await fetch(
            "/api/forgot-password",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                    email:
                    document.getElementById(
                        "email"
                    ).value

                })

            }
        );


        const data =
        await response.json();


        document.getElementById(
            "authMessage"
        ).textContent =
        data.message;

    }
);

</script>

</body>

</html>
