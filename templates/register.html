<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link
rel="stylesheet"
href="/static/auth.css">

</head>

<body>

<div class="auth-page">

<div class="auth-card">

<div class="auth-logo">
🎓
</div>

<h1>Create Account</h1>

<p class="auth-subtitle">
Create your College Predictor account
</p>


<form id="registerForm">

<div class="auth-group">

<label>Full Name</label>

<input
type="text"
id="name"
placeholder="Enter your full name"
required>

</div>


<div class="auth-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>


<div class="auth-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Minimum 8 characters"
minlength="8"
required>

</div>


<div
id="authMessage"
class="auth-message">
</div>


<button
type="submit"
class="auth-primary-btn">

Create Account

</button>

</form>


<p class="auth-switch">

Already have an account?

<a href="/login">
Login
</a>

</p>

</div>

</div>


<script>

document
.getElementById("registerForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const response =
        await fetch(
            "/api/register",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                    name:
                    document.getElementById(
                        "name"
                    ).value,

                    email:
                    document.getElementById(
                        "email"
                    ).value,

                    password:
                    document.getElementById(
                        "password"
                    ).value

                })

            }
        );


        const data =
        await response.json();


        if (!response.ok) {

            document.getElementById(
                "authMessage"
            ).textContent =
            data.error;

            return;

        }


        window.location.href =
        "/unlock";

    }
);

</script>

</body>

</html>
