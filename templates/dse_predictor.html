<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>DSE College Predictor</title>

<link rel="stylesheet"
href="/static/style.css">

</head>

<body>

<div class="container">

<div class="card">

<h1>DSE College Predictor</h1>

<p class="subtitle">
Find the Best Engineering Colleges
</p>
<p class="notice">L - Ladies, G - General, MI - Minority, PWD - Person with Disabilities, DEF - Defence, R - Reserved Common, EWS - Economically Weaker Section</p>
<!-- Percentage -->

<div class="form-group">

<label>
Diploma Percentage
</label>

<input
type="number"
id="percentage"
placeholder="Enter Percentage">

</div>

<!-- Category -->

<div class="form-group">

<label>

Category

</label>

<select id="category">

<option value="ALL">

Loading...

</option>

</select>

</div>

<!-- Branch -->

<div class="form-group">

<label>

Branch

</label>

<select id="branch">

<option value="ALL">

Loading...

</option>

</select>

</div>

<!-- Region -->

<div class="form-group">

<label>

Region

</label>

<select

id="region"

onchange="loadDistricts()"

>

<option value="ALL">

Loading...

</option>

</select>

</div>

<!-- District -->

<div class="form-group">

<label>

District

(Optional)

</label>

<select id="district">

<option value="ALL">

ALL

</option>

</select>

</div>

<!-- College Type -->

<div class="form-group">

<label>

College Type

</label>

<select id="college_type">

<option value="ALL">

Loading...

</option>

</select>

</div>

<button

class="search-btn"

onclick="searchCollege()"

>

Search Colleges

</button>

<div id="loading"

style="display:none">

Searching...

</div>

<div id="result">

</div>

</div>

</div>
<script src="/static/access.js"></script>
<script src="/static/script.js"></script>

</body>

</html>
