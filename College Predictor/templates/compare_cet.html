<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MHT CET College Compare
    </title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>


<div class="college-compare-page">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="college-compare-header">


        <button
            type="button"
            class="compare-back-button"
            onclick="window.location.href='/mhtcet'"
        >

            ← Back

        </button>


        <div class="compare-heading">

            <h1>

                MHT CET College Compare

            </h1>


            <p>

                Search and compare up to
                3 engineering colleges

            </p>

        </div>


    </div>



    <!-- =====================================
         SEARCH SECTION
    ====================================== -->

    <div class="compare-search-card">


        <div class="compare-search-title">

            <h2>

                Select Colleges

            </h2>


            <p>

                Search college name or
                institute code

            </p>

        </div>



        <!-- =================================
             COLLEGE 1
        ================================== -->

        <div
            class="college-search-group"
            id="collegeGroup1"
        >


            <label>

                First College

            </label>


            <div class="college-search-wrapper">


                <input
                    type="text"
                    id="collegeSearch1"
                    class="college-search-input"
                    placeholder="Search first college name..."
                    autocomplete="off"
                    oninput="searchCollege(1)"
                >


                <span class="college-search-icon">

                    🔍

                </span>


                <div
                    id="collegeSuggestions1"
                    class="college-suggestions"
                >
                </div>


            </div>



            <div
                id="selectedCollege1"
                class="selected-college-card"
                style="display:none;"
            >
            </div>


        </div>



        <!-- =================================
             COLLEGE 2
        ================================== -->

        <div
            class="college-search-group"
            id="collegeGroup2"
        >


            <label>

                Second College

            </label>


            <div class="college-search-wrapper">


                <input
                    type="text"
                    id="collegeSearch2"
                    class="college-search-input"
                    placeholder="Search second college name..."
                    autocomplete="off"
                    oninput="searchCollege(2)"
                >


                <span class="college-search-icon">

                    🔍

                </span>


                <div
                    id="collegeSuggestions2"
                    class="college-suggestions"
                >
                </div>


            </div>



            <div
                id="selectedCollege2"
                class="selected-college-card"
                style="display:none;"
            >
            </div>


        </div>



        <!-- =================================
             COLLEGE 3
        ================================== -->

        <div
            class="college-search-group"
            id="collegeGroup3"
        >


            <label>

                Third College

                <span class="optional-text">

                    (Optional)

                </span>

            </label>


            <div class="college-search-wrapper">


                <input
                    type="text"
                    id="collegeSearch3"
                    class="college-search-input"
                    placeholder="Search third college name..."
                    autocomplete="off"
                    oninput="searchCollege(3)"
                >


                <span class="college-search-icon">

                    🔍

                </span>


                <div
                    id="collegeSuggestions3"
                    class="college-suggestions"
                >
                </div>


            </div>



            <div
                id="selectedCollege3"
                class="selected-college-card"
                style="display:none;"
            >
            </div>


        </div>



        <!-- =================================
             COMPARE BUTTON
        ================================== -->

        <div class="compare-button-container">


            <button
                type="button"
                class="main-compare-button"
                onclick="compareColleges()"
            >

                Compare Colleges

            </button>


        </div>


    </div>



    <!-- =====================================
         LOADING
    ====================================== -->

    <div
        id="compareLoading"
        class="compare-loading"
        style="display:none;"
    >


        <div class="compare-loader">
        </div>


        <p>

            Comparing colleges...

        </p>


    </div>



    <!-- =====================================
         COMPARE RESULT
    ====================================== -->

    <div
        id="compareResult"
        class="compare-result"
    >
    </div>


</div>


<script src="/static/access.js"></script>
<script
    src="/static/compare_cet.js"
></script>


</body>

</html>
