<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Unlock Benefits</title>

<link
rel="stylesheet"
href="/static/payment.css">

<script
src="https://checkout.razorpay.com/v1/checkout.js">
</script>

</head>

<body>

<div class="unlock-page">

<div class="unlock-card">

<div class="unlock-icon">
🔓
</div>

<h1>
Unlock Your Benefits
</h1>

<p class="unlock-description">

Get complete access to College Predictor
tools for one full year.

</p>


<div class="benefit-list">

<div>✓ MHT CET College Predictor</div>

<div>✓ DSE College Predictor</div>

<div>✓ Search College & Cutoffs</div>

<div>✓ Compare Colleges</div>

<div>✓ Unlimited College Searches</div>

</div>


<div class="price-area">

<span class="price">
₹{{ price }}
</span>

<span class="period">
/ 1 Year
</span>

</div>


<button
id="payButton"
class="unlock-button"
onclick="startPayment()">

Unlock Now for ₹{{ price }}

</button>


<p class="payment-note">

One-time payment • 365 days access

</p>

</div>

</div>


<script>

async function startPayment() {

    const button =
    document.getElementById(
        "payButton"
    );


    button.disabled = true;

    button.textContent =
    "Creating payment...";


    try {

        const orderResponse =
        await fetch(
            "/api/create-order",
            {
                method: "POST"
            }
        );


       const contentType =
    orderResponse.headers.get(
        "content-type"
    ) || "";


if (
    !contentType.includes(
        "application/json"
    )
) {

    const errorText =
        await orderResponse.text();


    console.error(
        "CREATE ORDER SERVER ERROR:",
        errorText
    );


    throw new Error(
        "Payment server error. Check Flask terminal."
    );

}


const order =
    await orderResponse.json();


        if (
            orderResponse.status === 401
        ) {

            window.location.href =
            "/login";

            return;

        }


        if (order.already_active) {

    const returnPage =
        sessionStorage.getItem(
            "return_after_access"
        );


    sessionStorage.removeItem(
        "return_after_access"
    );


    if (returnPage) {

        window.location.href =
            returnPage;

    }

    else {

        window.location.href =
            "/";

    }


    return;

}


        if (!orderResponse.ok) {

            throw new Error(
                order.error
                ||
                "Unable to create order."
            );

        }


        const options = {

            key:
            order.key_id,

            amount:
            order.amount,

            currency:
            order.currency,

            name:
            "College Predictor",

            description:
            "1 Year Access",

            order_id:
            order.order_id,

            handler:
            verifyPayment,

            theme: {
                color:
                "#2563eb"
            },

            modal: {

                ondismiss:
                function() {

                    button.disabled =
                    false;

                    button.textContent =
                    "Unlock Now for ₹{{ price }}";

                }

            }

        };


        const razorpay =
        new Razorpay(options);


        razorpay.open();

    }

    catch (error) {

        alert(
            error.message
        );


        button.disabled =
        false;

        button.textContent =
        "Unlock Now for ₹{{ price }}";

    }

}


async function verifyPayment(
    payment
) {

    try {

        const response =
            await fetch(
                "/api/verify-payment",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            payment
                        )

                }
            );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        if (
            !contentType.includes(
                "application/json"
            )
        ) {

            const errorText =
                await response.text();


            console.error(
                "VERIFY PAYMENT SERVER ERROR:",
                errorText
            );


            throw new Error(
                "Payment verification server error."
            );

        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(

                data.error

                ||

                "Payment verification failed."

            );

        }


        // ==================================
        // PAYMENT SUCCESS
        // ==================================

        alert(
            "Payment Successful! Your 1 year access is active."
        );


        // ==================================
        // GET ORIGINAL PAGE
        // ==================================

        const returnPage =
            sessionStorage.getItem(
                "return_after_access"
            );


        // ==================================
        // REMOVE RETURN PAGE
        // ==================================

        sessionStorage.removeItem(
            "return_after_access"
        );


        // ==================================
        // RETURN TO ORIGINAL PAGE
        // ==================================

        if (returnPage) {

            window.location.href =
                returnPage;

        }

        else {

            window.location.href =
                "/";

        }

    }

    catch (error) {

        console.error(
            "PAYMENT VERIFY ERROR:",
            error
        );


        alert(
            error.message
        );

    }

}
const options = {

    key: order.key_id,

    amount: order.amount,

    currency: order.currency,

    name: "College Predictor",

    description: "1 Year Access",

    order_id: order.order_id,

    method: {
        upi: true,
        card: true,
        netbanking: true,
        wallet: true
    },

    handler: verifyPayment,

    theme: {
        color: "#2563eb"
    },

    modal: {

        ondismiss: function() {

            button.disabled = false;

            button.textContent =
                "Unlock Now for ₹{{ price }}";

        }

    }

};

</script>

</body>

</html>
